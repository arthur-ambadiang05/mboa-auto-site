<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Modifier un véhicule | Mboa Auto</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0b1018;color:#fff}header{padding:18px 22px;background:#131a24;border-bottom:1px solid #263140;display:flex;justify-content:space-between}.logo{font-size:24px;font-weight:800}.logo span{color:#ef4444}a{color:#fff;text-decoration:none}main{max-width:900px;margin:30px auto;padding:0 18px 50px}form{background:#131a24;border:1px solid #263140;border-radius:14px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;margin-bottom:6px;color:#d1d5db}input,select,textarea{width:100%;padding:12px;border:1px solid #374151;border-radius:8px;background:#0b1018;color:#fff}textarea{min-height:110px}.btn{margin-top:18px;width:100%;padding:14px;border:0;border-radius:9px;background:#ef4444;color:#fff;font-weight:700;cursor:pointer}.photo-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 14px}.photo-toolbar .btn{width:auto;margin:0;padding:10px 13px}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.photo{background:#0b1018;border:1px solid #374151;border-radius:12px;overflow:hidden}.photo img{width:100%;height:120px;object-fit:cover;display:block}.photo-info{padding:10px}.photo-name{font-size:12px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.photo-actions{display:flex;gap:6px;margin-top:8px}.photo-actions button{flex:1;border:0;border-radius:7px;padding:8px;font-weight:700;cursor:pointer}.replace{background:#374151;color:#fff}.delete{background:#7f1d1d;color:#fff}.cover{font-size:11px;color:#22c55e;margin-top:5px}.hint{font-size:12px;color:#9ca3af;margin-top:7px}#msg{margin-top:14px;min-height:20px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<header><div class="logo">MBOA <span>AUTO</span></div><a href="/admin/vehicles.html">← Véhicules</a></header>
<main><h1>Modifier l’annonce</h1><form id="f"><div class="grid">
<div><label>Marque</label><input name="brand" list="brandOptions" required><datalist id="brandOptions" data-brand-list></datalist></div><div><label>Nom / Modèle</label><input name="name" required></div>
<div><label>Année</label><input name="year" type="number" required></div><div><label>Type</label><input name="type" required></div>
<div><label>Carburant</label><input name="fuel" required></div><div><label>Prix FCFA</label><input name="price" type="number" required></div>
<div class="full"><label>Prix en lettres</label><input name="price_words" placeholder="Ex. Trente-cinq millions de francs CFA"></div>
<div><label>Localisation</label><input name="location" required></div><div><label>Statut</label><select name="status"><option value="disponible">Disponible</option><option value="reserve">Réservé</option><option value="vendu">Vendu</option></select></div>
<div class="full"><label>Caractéristiques</label><input name="specs" required></div><div class="full"><label>Description</label><textarea name="description" required></textarea></div>
<div class="full"><label>Photos de l’annonce</label><div class="photo-toolbar"><input id="newPhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple style="display:none"><button class="btn" id="addPhotos" type="button" style="background:#374151">+ Ajouter des photos</button><span class="hint">Vous pouvez remplacer ou supprimer chaque photo individuellement.</span></div><div id="photosGrid" class="photos"></div></div>
</div><button class="btn" id="saveBtn">Enregistrer les modifications</button><p id="msg"></p></form></main>
<script>
const slug=new URLSearchParams(location.search).get("slug");let current;let photoFiles=[];
const msg=document.getElementById("msg");
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function legacyFiles(v){if(Array.isArray(v.photo_files)&&v.photo_files.length)return [...v.photo_files];return Array.from({length:Number(v.photos||1)},(_,i)=>String(i+1).padStart(2,"0")+".jpg");}
function setMsg(text,color="#9ca3af"){msg.style.color=color;msg.textContent=text;}
async function compress(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{try{const max=1600,r=Math.min(max/img.width,max/img.height,1),w=Math.round(img.width*r),h=Math.round(img.height*r),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);resolve(c.toDataURL("image/jpeg",.82));}catch(e){reject(e)}};img.onerror=()=>reject(new Error("Impossible de traiter la photo"));img.src=reader.result};reader.onerror=()=>reject(new Error("Impossible de lire la photo"));reader.readAsDataURL(file);});}
async function upload(filename,file){const content=await compress(file);const r=await fetch("/.netlify/functions/admin-upload-photo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug,filename,content})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Envoi photo impossible");}
async function saveRegistry(extra={}){const vehicle={...current,...extra,photo_files:[...photoFiles],photos:photoFiles.length,cover:photoFiles.includes(extra.cover||current.cover)?(extra.cover||current.cover):(photoFiles[0]||""),detail_url:"/vehicules/vehicle.html?slug="+encodeURIComponent(slug)};const r=await fetch("/.netlify/functions/admin-manage-vehicle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"update",slug,vehicle})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Mise à jour impossible");current=vehicle;return d;}
function renderPhotos(){const grid=document.getElementById("photosGrid");if(!photoFiles.length){grid.innerHTML='<p class="hint">Aucune photo.</p>';return;}grid.innerHTML=photoFiles.map((name,i)=>'<div class="photo"><img src="/assets/cars/'+encodeURIComponent(slug)+'/'+encodeURIComponent(name)+'?v='+Date.now()+'" alt=""><div class="photo-info"><div class="photo-name">'+esc(name)+'</div>'+(name===current.cover?'<div class="cover">Photo principale</div>':'')+'<div class="photo-actions"><button class="replace" type="button" onclick="replacePhoto(\''+name+'\')">Remplacer</button><button class="delete" type="button" onclick="deletePhoto(\''+name+'\')">Supprimer</button></div></div></div>').join("");}
async function replacePhoto(name){const input=document.createElement("input");input.type="file";input.accept="image/jpeg,image/png,image/webp";input.onchange=async()=>{if(!input.files[0])return;try{setMsg("Remplacement de la photo...");await upload(name,input.files[0]);setMsg("Photo remplacée avec succès.","#22c55e");renderPhotos();}catch(e){setMsg(e.message,"#ef4444");}};input.click();}
async function deletePhoto(name){if(photoFiles.length<=1){setMsg("Gardez au moins une photo pour l’annonce.","#ef4444");return;}if(!confirm("Supprimer cette photo ?"))return;try{setMsg("Suppression de la photo...");const r=await fetch("/.netlify/functions/admin-delete-photo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug,filename:name})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Suppression impossible");photoFiles=photoFiles.filter(x=>x!==name);const nextCover=current.cover===name?photoFiles[0]:current.cover;await saveRegistry({cover:nextCover});setMsg("Photo supprimée.","#22c55e");renderPhotos();}catch(e){setMsg(e.message,"#ef4444");}}
document.getElementById("addPhotos").onclick=()=>document.getElementById("newPhotos").click();
document.getElementById("newPhotos").addEventListener("change",async e=>{const files=Array.from(e.target.files||[]);if(!files.length)return;try{for(let i=0;i<files.length;i++){setMsg("Ajout photo "+(i+1)+"/"+files.length+"...");const name="photo-"+Date.now()+"-"+(i+1)+".jpg";await upload(name,files[i]);photoFiles.push(name);}await saveRegistry({});setMsg("Nouvelles photos ajoutées.","#22c55e");renderPhotos();e.target.value="";}catch(err){setMsg(err.message,"#ef4444");}});
async function init(){const s=await fetch("/.netlify/functions/admin-session");if(!s.ok){location.href="/admin/";return;}const registry=await fetch("/.netlify/functions/admin-manage-vehicle");if(!registry.ok){setMsg("Chargement du stock impossible","#ef4444");return;}const {vehicles:data}=await registry.json();current=data.find(v=>v.slug===slug);if(!current){setMsg("Véhicule introuvable","#ef4444");return;}photoFiles=legacyFiles(current);for(const [k,v] of Object.entries(current)){const el=document.querySelector('[name="'+k+'"]');if(el)el.value=v??"";}renderPhotos();}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();if(!photoFiles.length){setMsg("Ajoutez au moins une photo.","#ef4444");return;}const fd=new FormData(e.target),price=Number(fd.get("price"));const vehicle={...current,brand:fd.get("brand").trim(),name:fd.get("name").trim(),year:Number(fd.get("year")),type:fd.get("type").trim(),fuel:fd.get("fuel").trim(),price,price_display:price.toLocaleString("fr-FR")+" FCFA",price_words:String(fd.get("price_words")||"").trim(),location:fd.get("location").trim(),status:fd.get("status"),specs:fd.get("specs").trim(),description:fd.get("description").trim(),photo_files:[...photoFiles],photos:photoFiles.length,cover:photoFiles.includes(current.cover)?current.cover:photoFiles[0],detail_url:"/vehicules/vehicle.html?slug="+encodeURIComponent(slug)};try{document.getElementById("saveBtn").disabled=true;setMsg("Enregistrement...");await saveRegistry(vehicle);setMsg("Modifications enregistrées.","#22c55e");setTimeout(()=>location.href="/admin/vehicles.html",900);}catch(err){setMsg(err.message,"#ef4444");}finally{document.getElementById("saveBtn").disabled=false;}});
init();
</script><script src="/brands.js" defer></script></body></html>
