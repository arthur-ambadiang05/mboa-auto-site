<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Modifier un véhicule | Mboa Auto</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0b1018;color:#fff}header{padding:18px 22px;background:#131a24;border-bottom:1px solid #263140;display:flex;justify-content:space-between}.logo{font-size:24px;font-weight:800}.logo span{color:#ef4444}a{color:#fff;text-decoration:none}main{max-width:850px;margin:30px auto;padding:0 18px}form{background:#131a24;border:1px solid #263140;border-radius:14px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;margin-bottom:6px;color:#d1d5db}input,select,textarea{width:100%;padding:12px;border:1px solid #374151;border-radius:8px;background:#0b1018;color:#fff}textarea{min-height:110px}.btn{margin-top:18px;width:100%;padding:14px;border:0;border-radius:9px;background:#ef4444;color:#fff;font-weight:700}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body>
<header><div class="logo">MBOA <span>AUTO</span></div><a href="/admin/vehicles.html">← Véhicules</a></header>
<main><h1>Modifier l’annonce</h1><form id="f"><div class="grid">
<div><label>Marque</label><input name="brand" list="brandOptions" required><datalist id="brandOptions" data-brand-list></datalist></div><div><label>Nom / Modèle</label><input name="name" required></div>
<div><label>Année</label><input name="year" type="number" required></div><div><label>Type</label><input name="type" required></div>
<div><label>Carburant</label><input name="fuel" required></div><div><label>Prix FCFA</label><input name="price" type="number" required></div>
<div><label>Localisation</label><input name="location" required></div><div><label>Statut</label><select name="status"><option value="disponible">Disponible</option><option value="vendu">Vendu</option></select></div>
<div class="full"><label>Caractéristiques</label><input name="specs" required></div><div class="full"><label>Description</label><textarea name="description" required></textarea></div>
</div><button class="btn">Enregistrer les modifications</button><p id="msg"></p></form></main>
<script>
const slug=new URLSearchParams(location.search).get("slug");let current;
async function init(){const s=await fetch("/.netlify/functions/admin-session");if(!s.ok){location.href="/admin/";return;}const data=await (await fetch("/data/vehicules.json?ts="+Date.now())).json();current=data.find(v=>v.slug===slug);if(!current){document.getElementById("msg").textContent="Véhicule introuvable";return;}for(const [k,v] of Object.entries(current)){const el=document.querySelector('[name="'+k+'"]');if(el)el.value=v;}}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const fd=new FormData(e.target);const price=Number(fd.get("price"));const vehicle={...current,brand:fd.get("brand").trim(),name:fd.get("name").trim(),year:Number(fd.get("year")),type:fd.get("type").trim(),fuel:fd.get("fuel").trim(),price,price_display:price.toLocaleString("fr-FR")+" FCFA",location:fd.get("location").trim(),status:fd.get("status"),specs:fd.get("specs").trim(),description:fd.get("description").trim()};const r=await fetch("/.netlify/functions/admin-manage-vehicle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"update",slug,vehicle})});const d=await r.json();const m=document.getElementById("msg");if(!r.ok){m.style.color="#ef4444";m.textContent=d.error||"Erreur";return;}m.style.color="#22c55e";m.textContent="Modifications enregistrées.";setTimeout(()=>location.href="/admin/vehicles.html",1200);});
init();
</script><script src="/brands.js" defer></script></body></html>
