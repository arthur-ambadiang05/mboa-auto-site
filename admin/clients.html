<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Clients et rendez-vous | Mboa Auto</title><link rel="stylesheet" href="/admin/management.css"><script src="/admin/clients.js" defer></script></head><body aria-busy="true"><div id="loading">Vérification de la connexion…</div><header><a class="logo" href="/admin/dashboard.html">MBOA <b>AUTO</b></a><a class="btn" href="/admin/dashboard.html">← Tableau de bord</a></header><main><h1>Clients et rendez-vous</h1><p>Enregistrez vos demandes, préparez vos visites et suivez vos relances. Ce carnet est privé.</p><div class="toolbar"><button class="primary" id="newClient">+ Ajouter un client</button><button id="refresh">Actualiser</button></div><div class="filters"><div><label for="search">Chercher un client ou une voiture</label><input id="search" type="search" placeholder="Nom, téléphone, véhicule…"></div><div><label for="filter">Afficher</label><select id="filter"><option value="all">Tous les clients</option><option value="due">Relances à faire</option><option value="appointments">Rendez-vous à venir</option><option value="nouveau">Nouveaux</option><option value="contacte">Contactés</option><option value="rendez-vous">Visite prévue</option><option value="gagne">Ventes conclues</option><option value="perdu">Demandes clôturées</option></select></div></div><p class="notice" id="message" role="status" aria-live="polite"></p><div id="clients" class="grid"></div></main>
<dialog id="editor"><form id="clientForm"><div class="dialog-top"><h2 id="editorTitle">Ajouter un client</h2><button type="button" id="closeEditor" aria-label="Fermer">✕</button></div><div class="form-grid"><div><label for="clientName">Nom du client</label><input id="clientName" name="name" maxlength="120" required autocomplete="off"></div><div><label for="clientPhone">Téléphone / WhatsApp</label><input id="clientPhone" name="phone" type="tel" maxlength="30" placeholder="+237…" autocomplete="off"></div><div><label for="clientVehicle">Véhicule recherché</label><input id="clientVehicle" name="vehicle" maxlength="160" list="stock"><datalist id="stock"></datalist></div><div><label for="clientBudget">Budget FCFA</label><input id="clientBudget" name="budget" maxlength="40" inputmode="numeric" placeholder="Ex. 8 000 000"></div><div><label for="clientStatus">Avancement</label><select id="clientStatus" name="status"><option value="nouveau">Nouveau</option><option value="contacte">Contacté</option><option value="rendez-vous">Visite prévue</option><option value="gagne">Vente conclue</option><option value="perdu">Demande clôturée</option></select></div><div><label for="clientFollowUp">Prochaine relance</label><input id="clientFollowUp" name="followUp" type="datetime-local"></div><div class="full"><label for="clientAppointment">Date du rendez-vous</label><input id="clientAppointment" name="appointment" type="datetime-local"><small class="muted">Les dates utilisent l’heure de votre téléphone. Le suivi n’envoie pas de rappel automatique.</small></div><div class="full"><label for="clientNotes">Notes privées</label><textarea id="clientNotes" name="notes" maxlength="3000" rows="4" placeholder="Besoin, échange, lieu du rendez-vous…"></textarea></div></div><p id="formMessage" class="notice" role="status"></p><div class="actions"><button class="primary" id="saveClient">Enregistrer</button><button type="button" id="cancelEditor">Annuler</button></div></form></dialog></body></html>
