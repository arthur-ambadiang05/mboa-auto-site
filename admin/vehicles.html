<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gérer les véhicules | Mboa Auto</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0b1018;color:#fff}header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;background:#131a24;border-bottom:1px solid #263140}.logo{font-weight:800;font-size:24px}.logo span{color:#ef4444}a{color:inherit;text-decoration:none}main{max-width:1000px;margin:30px auto;padding:0 18px}.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.btn{padding:11px 14px;border-radius:9px;border:1px solid #374151;background:#131a24;color:#fff;cursor:pointer}.primary{background:#ef4444;border-color:#ef4444}.grid{display:grid;gap:14px}.card{background:#131a24;border:1px solid #263140;border-radius:14px;padding:16px;display:grid;grid-template-columns:88px 1fr;gap:14px}.card img{width:88px;height:70px;object-fit:cover;border-radius:9px}.meta{color:#9ca3af;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.danger{background:#7f1d1d;border-color:#991b1b}.sold{background:#374151}.msg{margin:14px 0;color:#9ca3af}@media(max-width:600px){.card{grid-template-columns:70px 1fr}.card img{width:70px;height:60px}}</style></head><body>
<header><div class="logo">MBOA <span>AUTO</span></div><a class="btn" href="/admin/dashboard.html">← Tableau de bord</a></header>
<main><h1>Gérer les véhicules</h1><p class="msg">Modifiez une annonce, marquez-la vendue ou supprimez-la du catalogue.</p><div class="top"><a class="btn primary" href="/admin/add-vehicle.html">+ Ajouter</a></div><div id="list" class="grid">Chargement...</div></main>
<script>
async function session(){const r=await fetch("/.netlify/functions/admin-session");if(!r.ok)location.href="/admin/";}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
async function load(){
 const r=await fetch("/data/vehicules.json?ts="+Date.now());const data=await r.json();const list=document.getElementById("list");
 list.innerHTML=data.map(v=>`<div class="card"><img src="/assets/cars/${esc(v.slug)}/${esc(v.cover||"01.jpg")}"><div><strong>${esc(v.name)}</strong><div class="meta">${esc(v.price_display)} • ${esc(v.status)}</div><div class="actions"><a class="btn" href="/admin/edit-vehicle.html?slug=${encodeURIComponent(v.slug)}">Modifier</a><button class="btn sold" onclick="sold('${v.slug}')">Marquer vendu</button><button class="btn danger" onclick="del('${v.slug}','${esc(v.name)}')">Supprimer</button></div></div></div>`).join("");
}
async function api(payload){const r=await fetch("/.netlify/functions/admin-manage-vehicle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error||"Erreur");return d;}
async function sold(slug){const all=await (await fetch("/data/vehicules.json?ts="+Date.now())).json();const v=all.find(x=>x.slug===slug);if(!v)return;v.status="vendu";await api({action:"update",slug,vehicle:v});alert("Véhicule marqué vendu.");setTimeout(load,1200);}
async function del(slug,name){if(!confirm("Supprimer l’annonce « "+name+" » du catalogue ?"))return;await api({action:"delete",slug});alert("Annonce supprimée.");setTimeout(load,1200);}
session().then(load);
</script></body></html>
