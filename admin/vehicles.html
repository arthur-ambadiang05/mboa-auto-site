<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Stock | Mboa Auto</title><link rel="stylesheet" href="/admin/management.css"></head><body aria-busy="true"><div id="loading">Vérification de la connexion…</div><header><a class="logo" href="/admin/dashboard.html">MBOA <b>AUTO</b></a><a class="btn" href="/admin/dashboard.html">← Tableau de bord</a></header><main><h1>Votre stock</h1><p>Les voitures réservées et vendues ne sont plus proposées dans le catalogue public après sa mise à jour.</p><div class="toolbar"><a class="btn primary" href="/admin/add-vehicle.html">+ Ajouter un véhicule</a><button id="refresh">Actualiser</button></div><div class="filters"><div><label for="search">Chercher une voiture</label><input id="search" type="search" placeholder="Modèle, marque…"></div><div><label for="filter">Statut</label><select id="filter"><option value="all">Tous les véhicules</option><option value="disponible">Disponibles</option><option value="reserve">Réservés</option><option value="vendu">Vendus</option></select></div></div><p class="notice" id="message" role="status"></p><div id="list" class="grid"></div></main><script>
const $=id=>document.getElementById(id);let vehicles=[];const labels={disponible:'Disponible',reserve:'Réservé',vendu:'Vendu'};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=$('search').value.toLowerCase();const rows=vehicles.filter(v=>($('filter').value==='all'||v.status===$('filter').value)&&(v.name+' '+v.brand).toLowerCase().includes(q));$('list').innerHTML=rows.map(v=>'<article class="card vehicle"><img src="/assets/cars/'+encodeURIComponent(v.slug)+'/'+encodeURIComponent(v.cover||'01.jpg')+'" alt="'+esc(v.name)+'"><div><strong>'+esc(v.name)+'</strong><p>'+esc(v.price_display)+' · <span class="badge">'+(labels[v.status]||esc(v.status))+'</span></p><div class="actions"><a class="btn" href="/admin/edit-vehicle.html?slug='+encodeURIComponent(v.slug)+'">Modifier l’annonce</a><label>Statut<select data-slug="'+esc(v.slug)+'">'+Object.entries(labels).map(([k,l])=>'<option value="'+k+'"'+(v.status===k?' selected':'')+'>'+l+'</option>').join('')+'</select></label><button data-delete="'+esc(v.slug)+'">Supprimer</button></div></div></article>').join('')||'<div class="panel">Aucun véhicule dans cette sélection.</div>';}
async function api(body){const r=await fetch('/.netlify/functions/admin-manage-vehicle',{method:body?'POST':'GET',cache:'no-store',...(body?{headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});if(r.status===401){location.href='/admin/';throw Error('Connexion expirée');}const d=await r.json();if(!r.ok)throw Error(d.error||'Enregistrement impossible');return d;}
async function load(){try{$('refresh').disabled=true;$('message').textContent='Chargement du stock…';vehicles=(await api()).vehicles;render();$('message').textContent=vehicles.length+' véhicule(s) dans votre stock.';}catch(e){$('message').textContent=e.message;}finally{$('refresh').disabled=false;}}
$('search').oninput=render;$('filter').onchange=render;$('refresh').onclick=load;
$('list').onchange=async e=>{const s=e.target.closest('[data-slug]');if(!s)return;const v=vehicles.find(x=>x.slug===s.dataset.slug),previous=v.status;try{s.disabled=true;$('message').textContent='Enregistrement…';await api({action:'status',slug:v.slug,status:s.value});v.status=s.value;render();$('message').textContent='Statut enregistré. Le catalogue public sera actualisé après publication.';}catch(err){s.value=previous;$('message').textContent=err.message;}finally{s.disabled=false;}};
$('list').onclick=async e=>{const b=e.target.closest('[data-delete]');if(!b)return;const v=vehicles.find(x=>x.slug===b.dataset.delete);if(!confirm('Supprimer l’annonce « '+v.name+' » du catalogue ?'))return;try{b.disabled=true;await api({action:'delete',slug:v.slug});vehicles=vehicles.filter(x=>x.slug!==v.slug);render();$('message').textContent='Annonce supprimée du registre.';}catch(err){$('message').textContent=err.message;b.disabled=false;}};
(async()=>{try{const s=await fetch('/.netlify/functions/admin-session',{cache:'no-store'});if(!s.ok){location.href='/admin/';return;}$('loading').hidden=true;document.body.setAttribute('aria-busy','false');await load();}catch{$('loading').textContent='Connexion indisponible. Actualisez la page.';}})();
</script></body></html>
