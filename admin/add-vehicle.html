<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Ajouter un véhicule | Mboa Auto</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1018;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #131a24;
      border-bottom: 1px solid #263140;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .logo span {
      color: #ef4444;
    }

    .back {
      color: white;
      text-decoration: none;
      border: 1px solid #374151;
      padding: 10px 14px;
      border-radius: 8px;
    }

    main {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 20px 50px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 28px;
    }

    form {
      background: #131a24;
      border: 1px solid #263140;
      border-radius: 16px;
      padding: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #d1d5db;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #374151;
      border-radius: 9px;
      background: #0b1018;
      color: white;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #ef4444;
    }

    button {
      margin-top: 25px;
      width: 100%;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      min-height: 22px;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #0b1018;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <div id="loading">Vérification de la connexion...</div>

  <header>
    <div class="logo">MBOA <span>AUTO</span></div>
    <a class="back" href="/admin/dashboard.html">← Tableau de bord</a>
  </header>

  <main>
    <h1>Ajouter un véhicule</h1>
    <p class="subtitle">
      Remplissez les informations du véhicule à publier sur Mboa Auto.
    </p>

    <form id="vehicleForm">

      <div class="grid">

        <div>
          <label for="brand">Marque</label>
          <input id="brand" name="brand" list="brandOptions" placeholder="Toyota" required><datalist id="brandOptions" data-brand-list></datalist>
        </div>

        <div>
          <label for="name">Nom / Modèle</label>
          <input id="name" name="name" placeholder="Toyota RAV4 2022" required>
        </div>

        <div>
          <label for="year">Année</label>
          <input id="year" name="year" type="number" min="1950" max="2100" required>
        </div>

        <div>
          <label for="type">Type</label>
          <select id="type" name="type" required>
            <option value="">Choisir</option>
            <option value="SUV">SUV</option>
            <option value="Berline">Berline</option>
            <option value="Pick-up">Pick-up</option>
            <option value="4x4">4x4</option>
            <option value="Monospace">Monospace</option>
            <option value="Coupé">Coupé</option>
            <option value="Compacte">Compacte</option>
          </select>
        </div>

        <div>
          <label for="fuel">Carburant</label>
          <select id="fuel" name="fuel" required>
            <option value="">Choisir</option>
            <option value="Essence">Essence</option>
            <option value="Diesel">Diesel</option>
            <option value="Hybride">Hybride</option>
            <option value="Électrique">Électrique</option>
          </select>
        </div>

        <div>
          <label for="price">Prix en FCFA</label>
          <input
            id="price"
            name="price"
            type="number"
            placeholder="18000000"
            required
          >
        </div>

        <div>
          <label for="priceWords">Prix en lettres</label>
          <input
            id="priceWords"
            name="price_words"
            placeholder="Ex. Trente-cinq millions de francs CFA"
          >
        </div>

        <div>
          <label for="location">Localisation</label>
          <input
            id="location"
            name="location"
            placeholder="Yaoundé"
            value="Yaoundé"
            required
          >
        </div>

        <div>
          <label for="status">Statut</label>
          <select id="status" name="status">
            <option value="disponible">Disponible</option>
            <option value="vendu">Vendu</option>
          </select>
        </div>

        <div class="full">
          <label for="specs">Caractéristiques principales</label>
          <input
            id="specs"
            name="specs"
            placeholder="Automatique • Essence • 4x4 • 51 843 km • Climatisation..."
            required
          >
        </div>

        <div class="full">
          <label for="description">Description</label>
          <textarea
            id="description"
            name="description"
            placeholder="Décrivez le véhicule..."
            required
          ></textarea>
        </div>

       <div class="full">
  <label for="photoFiles">Photos du véhicule</label>

  <input
    id="photoFiles"
    name="photoFiles"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    multiple
    required
  >

  <p id="photoInfo" style="margin-top:8px;color:#9ca3af;font-size:13px;">
    Vous pouvez sélectionner plusieurs photos depuis votre galerie.
    La première photo sélectionnée sera la photo principale.
  </p>

  <input type="hidden" id="cover" name="cover" value="01.jpg">
  <input type="hidden" id="photos" name="photos" value="1">
</div>
      <button id="submitButton" type="submit">
        Publier le véhicule
      </button>

      <div id="message"></div>

    </form>
  </main>

  <script>
    async function checkSession() {
      try {
        const response = await fetch("/.netlify/functions/admin-session");

        if (!response.ok) {
          window.location.href = "/admin/";
          return;
        }

        document.getElementById("loading").style.display = "none";
      } catch (error) {
        window.location.href = "/admin/";
      }
    }

    function createSlug(text) {
      return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    // Each physical car gets its own listing and photo directory, even with the same name.
    function createListingSlug(name) {
      return (createSlug(name) || "vehicule") + "-" + crypto.randomUUID();
    }
    let pendingListingSlug = null;

    function formatPrice(price) {
      return Number(price).toLocaleString("fr-FR") + " FCFA";
    }

    const form = document.getElementById("vehicleForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
  event.preventDefault();

  button.disabled = true;
  button.textContent = "Publication...";
  message.textContent = "";

  const formData = new FormData(form);
  const photoInput = document.getElementById("photoFiles");
  const files = Array.from(photoInput.files || []);

  if (files.length === 0) {
    message.style.color = "#ef4444";
    message.textContent = "Sélectionnez au moins une photo.";
    button.disabled = false;
    button.textContent = "Publier le véhicule";
    return;
  }

  try {
    // Reuse the identifier after a failed upload; reset it only after successful publication.
    const slug = pendingListingSlug || (pendingListingSlug = createListingSlug(formData.get("name")));
    // 1. Envoi des photos
    for (let i = 0; i < files.length; i++) {
      const file = files[i];

      const filename =
        String(i + 1).padStart(2, "0") + ".jpg";

      button.textContent =
        `Envoi photo ${i + 1}/${files.length}...`;

      const content = await new Promise((resolve, reject) => {
  const reader = new FileReader();

  reader.onload = () => {
    const img = new Image();

    img.onload = () => {
      try {
        const maxWidth = 1600;
        const maxHeight = 1600;

        let width = img.width;
        let height = img.height;

        const ratio = Math.min(
          maxWidth / width,
          maxHeight / height,
          1
        );

        width = Math.round(width * ratio);
        height = Math.round(height * ratio);

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        const compressed = canvas.toDataURL("image/jpeg", 0.82);
        resolve(compressed);

      } catch (error) {
        reject(error);
      }
    };

    img.onerror = () =>
      reject(new Error("Impossible de traiter la photo"));

    img.src = reader.result;
  };

  reader.onerror = () =>
    reject(new Error("Impossible de lire une photo"));

  reader.readAsDataURL(file);
});
      const uploadResponse = await fetch(
        "/.netlify/functions/admin-upload-photo",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            slug,
            create: true,
            filename,
            content
          })
        }
      );

      const uploadData = await uploadResponse.json();

      if (!uploadResponse.ok) {
        throw new Error(
          uploadData.error || "Erreur lors de l'envoi des photos"
        );
      }
    }

    // 2. Création des données du véhicule
const vehicle = {
      slug,
      brand: formData.get("brand").trim(),
      name: formData.get("name").trim(),
      year: Number(formData.get("year")),
      type: formData.get("type"),
      fuel: formData.get("fuel"),
      price: Number(formData.get("price")),
      price_display: formatPrice(formData.get("price")),
      price_words: String(formData.get("price_words") || "").trim(),
      location: formData.get("location").trim(),
      specs: formData.get("specs").trim(),
      description: formData.get("description").trim(),
      cover: "01.jpg",
      photos: files.length,
      photo_files: files.map((_, i) => String(i + 1).padStart(2, "0") + ".jpg"),
      status: formData.get("status")
    };

    button.textContent = "Publication du véhicule...";

    // 3. Ajout dans vehicles.json
    const response = await fetch(
      "/.netlify/functions/admin-add-vehicle",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(vehicle)
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Publication impossible"
      );
    }

    message.style.color = "#22c55e";
    message.textContent =
      "Véhicule et photos ajoutés avec succès.";

    pendingListingSlug = null;
    form.reset();

  } catch (error) {
    message.style.color = "#ef4444";
    message.textContent = error.message;
  } finally {
    button.disabled = false;
    button.textContent = "Publier le véhicule";
  }
});
    checkSession();
  </script>

<script src="/brands.js" defer></script></body>
</html>
